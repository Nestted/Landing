version: "3.9"

services:
  web:
    image: nestted-gatsby
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - nestted_node_modules:/app/node_modules
      - nestted_gatsby_cache:/app/.cache
    command: bash -lc "npm install && npm run develop -- -H 0.0.0.0 -p 8000"

volumes:
  nestted_node_modules:
  nestted_gatsby_cache:
